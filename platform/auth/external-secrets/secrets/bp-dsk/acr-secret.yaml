apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: acr-pull-secret
  # No namespace defined here if using Kustomize/Argo to manage it
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-store
  target:
    name: acr-pull-secret # The name of the resulting K8s secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "tatrman.azurecr.io": {
                "username": "{{ .client_id }}",
                "password": "{{ .client_secret }}",
                "auth": "{{ printf "%s:%s" .client_id .client_secret | b64enc }}"
              }
            }
          }
  data:
    - secretKey: client_id
      remoteRef:
        key: acr-client-id
    - secretKey: client_secret
      remoteRef:
        key: acr-client-secret