apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Note: I put this in 'data' namespace for simplicity,
# but you might want a 'messaging' namespace.
namespace: data

helmCharts:
  - name: nats
    repo: https://nats-io.github.io/k8s/helm/charts/
    version: 2.12.4
    releaseName: nats
    namespace: data
    valuesFile: ../../base/values.yaml