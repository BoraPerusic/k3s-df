apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j-onto # This must match the generated StatefulSet name
  namespace: data
spec:
  template:
    spec:
      containers:
        - name: neo4j
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: neo4j-onto-creds
                  key: NEO4J_AUTH