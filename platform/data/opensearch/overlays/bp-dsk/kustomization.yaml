apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data

resources:
  - sealed-opensearch-admin-creds.yaml

helmCharts:
  - name: opensearch
    repo: https://opensearch-project.github.io/helm-charts
    version: 3.4.0
    releaseName: opensearch
    namespace: data
    valuesFile: ../../base/values.yaml