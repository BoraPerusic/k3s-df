apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: data

# 1. Bring in the Base
resources:
  - ../../base
  - sealed-mssql-db-creds.yaml

patches:
  # patches the service so that it uses LoadBalancer and remaps the port
  - target:
      kind: Service
      name: data-mssql
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
      
      - op: replace
        path: /spec/ports/0/port
        value: 7443  # External Port (Arbitrary choice, e.g., 7143)