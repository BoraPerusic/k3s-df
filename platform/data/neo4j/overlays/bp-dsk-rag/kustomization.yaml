apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data

resources:
  - sealed-neo4j-rag-creds.yaml

helmCharts:
  - name: neo4j
    repo: https://neo4j.github.io/helm-charts/
    version: 2025.12.1
    releaseName: neo4j
    namespace: data
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - rag-values.yaml