apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 1. Define the Helm Chart to inflate
helmCharts:
  - name: microservice
    # Point to the local chart in your monorepo
    # ArgoCD supports relative paths if the chart is in the same repo
    repo: ../../../../blueprints
    version: 1.0.0
    releaseName: llm-gateway
    namespace: infra
    valuesFile: values.yaml